[tool.poetry]
name = "literature-review-search"
version = "0.1.0"
description = "Automated search and filtering of academic papers using PubMed API."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.31.0"
pandas = "^2.2.1"
xmltodict = "^0.13.0"
python-dotenv = "^1.0.1"
beautifulsoup4 = "^4.13.3"
xlrd = "^2.0.1"
openpyxl = "^3.1.5"
playwright = "^1.44.0"
# AWS Bedrock client for the classifier raters + adjudicator
boto3 = "^1.35.0"
pypdf = "^6.14.0"
lxml = "^6.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
